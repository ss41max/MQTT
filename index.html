<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 MQTT Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      padding: 40px;
    }
    h1 {
      margin-bottom: 30px;
    }
    button {
      font-size: 20px;
      padding: 15px 30px;
      margin: 10px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: 0.2s;
    }
    .on {
      background-color: #28a745;
      color: white;
    }
    .off {
      background-color: #dc3545;
      color: white;
    }
    #status {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>ESP32 MQTT Control</h1>

  <button id="onBtn" class="on" onclick="sendMessage('ON')">ON</button>
  <button id="offBtn" class="off" onclick="sendMessage('OFF')">OFF</button>

  <div id="status">Connecting...</div>
  <div id="paymentBox" style="margin-top:20px;">
  <h3>Payment Details</h3>
  <p>Amount: ₹<span id="amount">--</span></p>
  <p>Status: <span id="paymentStatus">Waiting...</span></p>
  <p>Time: <span id="time">--</span></p>
</div>


  <script>
    /* ===== MQTT CONFIG ===== */
    const brokerUrl = "wss://d81c3cd5abb4432bb5b7729e27766fa9.s1.eu.hivemq.cloud:8884/mqtt";
    const options = {
      username: "ESP32_MQTT_test",
      password: "ESP@mqtt123",
      clean: true,
      connectTimeout: 4000
    };

    const controlTopic = "esp32/control";
    const statusTopic = "esp32/status";

    /* ===== CONNECT TO MQTT ===== */
    const client = mqtt.connect(brokerUrl, options);
    const statusEl = document.getElementById("status");
    const onBtn = document.getElementById("onBtn");
    const offBtn = document.getElementById("offBtn");

    client.on("connect", () => {
      console.log("Connected to MQTT");
      statusEl.textContent = "Connected to ESP32";
      statusEl.style.color = "green";

      // Subscribe to status updates
      client.subscribe(statusTopic, (err) => {
        if (err) console.error("Failed to subscribe to status topic");
      });
    });

    client.on("error", (err) => {
      console.error("MQTT Error:", err);
      statusEl.textContent = "Connection error";
      statusEl.style.color = "red";
    });

    /* ===== RECEIVE STATUS ===== */
    client.on("message", (topic, message) => {
      if (topic === statusTopic) {
        const state = message.toString();
        statusEl.textContent = "ESP32 State: " + state;

        // Change button colors dynamically
        if (state === "ON") {
          onBtn.style.backgroundColor = "#28a745"; // green
          offBtn.style.backgroundColor = "#aaa"; // gray
        } else if (state === "OFF") {
          offBtn.style.backgroundColor = "#dc3545"; // red
          onBtn.style.backgroundColor = "#aaa"; // gray
        }
      }
    });

    /* ===== SEND CONTROL MESSAGE ===== */
function sendMessage(message) {
  if (!client.connected) {
    alert("MQTT not connected");
    return;
  }
  client.publish(controlTopic, message);
  console.log("Sent:", message);

  // Instant visual feedback
  if (message === "ON") {
    onBtn.style.backgroundColor = "#28a745";
    offBtn.style.backgroundColor = "#aaa";
    statusEl.textContent = "Sent ON...";
  } else if (message === "OFF") {
    offBtn.style.backgroundColor = "#dc3545";
    onBtn.style.backgroundColor = "#aaa";
    statusEl.textContent = "Sent OFF...";
  }
}
const eventSource = new EventSource(
  "https://mqtt-backend-delta.vercel.app/events"
);

eventSource.onmessage = function (event) {
  const payment = JSON.parse(event.data);

  console.log("💰 Payment received:", payment);

  document.getElementById("amount").innerText = payment.amount;
  document.getElementById("paymentStatus").innerText = payment.status;
  document.getElementById("time").innerText =
    new Date(payment.time).toLocaleString();

  // OPTIONAL: auto-enable ESP after payment
  if (payment.status === "captured") {
    statusEl.textContent = "Payment received. ESP32 ready.";
    statusEl.style.color = "green";
  }
};

eventSource.onerror = function () {
  console.log("⚠️ SSE connection error");
};


  </script>

</body>
</html>

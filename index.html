<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ESP32 Control Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --green: #22c55e;
      --red: #ef4444;
      --border: #1f2933;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .container {
      max-width: 900px;
      margin: auto;
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid var(--border);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }

    .controls {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button.control {
      padding: 14px 32px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }

    .on {
      background: var(--green);
      color: #052e16;
    }

    .off {
      background: var(--red);
      color: #450a0a;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>ESP32 Control Dashboard</h1>
</header>

<div class="container">

  <!-- STATUS CARD -->
  <div class="card">
    <div class="status">
      <div id="statusDot" class="dot"></div>
      <div id="status">Connecting to ESP32...</div>
    </div>
  </div>

  <!-- CONTROL CARD -->
  <div class="card controls">
    <button class="control on" onclick="sendMessage('ON')">Turn ON</button>
    <button class="control off" onclick="sendMessage('OFF')">Turn OFF</button>
  </div>

</div>

<footer>
  Final Year Major Project • ESP32 + MQTT
</footer>

<script>
  /* ===== MQTT CONFIG ===== */
  const brokerUrl =
    "wss://d81c3cd5abb4432bb5b7729e27766fa9.s1.eu.hivemq.cloud:8884/mqtt";

  const client = mqtt.connect(brokerUrl, {
    username: "ESP32_MQTT_test",
    password: "ESP@mqtt123",
    clean: true,
    connectTimeout: 4000
  });

  const statusEl = document.getElementById("status");
  const dot = document.getElementById("statusDot");

  client.on("connect", () => {
    statusEl.textContent = "Connected to ESP32";
    dot.style.background = "#22c55e";
    client.subscribe("esp32/status");
  });

  client.on("reconnect", () => {
    statusEl.textContent = "Reconnecting...";
    dot.style.background = "#facc15";
  });

  client.on("offline", () => {
    statusEl.textContent = "MQTT Offline";
    dot.style.background = "#ef4444";
  });

  client.on("message", (_, message) => {
    const state = message.toString();
    statusEl.textContent = "ESP32 State: " + state;
    dot.style.background =
      state === "ON" ? "#22c55e" : "#ef4444";
  });

  function sendMessage(msg) {
    if (!client.connected) {
      alert("MQTT not connected");
      return;
    }
    client.publish("esp32/control", msg);
  }
</script>

</body>
</html>

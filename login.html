<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-container { display: flex; flex-direction: column; gap: 10px; width: 300px; }
    input, button { padding: 8px; font-size: 16px; }
    button { cursor: pointer; }
  </style>
</head>
<body>

<div class="login-container">
  <input type="text" id="username" placeholder="Username" />
  <input type="password" id="password" placeholder="Password" />
  <button id="loginBtn">Login</button>
  <p id="message" style="color:red;"></p>
</div>

<script>
const backendURL = "https://mqtt-backend-yourproject.vercel.app"; // replace with your backend URL

document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const messageEl = document.getElementById("message");

  if (!username || !password) {
    messageEl.textContent = "Please enter username and password";
    return;
  }

  try {
    const res = await fetch(`${backendURL}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok && data.token) {
      localStorage.setItem("token", data.token);
      messageEl.style.color = "green";
      messageEl.textContent = `Login successful! Role: ${data.role}`;
      // redirect or fetch protected data
      // window.location.href = "/dashboard.html";
    } else {
      messageEl.style.color = "red";
      messageEl.textContent = data.error || "Login failed";
    }
  } catch (err) {
    console.error(err);
    messageEl.style.color = "red";
    messageEl.textContent = "Server error, please try again";
  }
});
</script>

</body>
</html>
